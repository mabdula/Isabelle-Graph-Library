# modes.conf -- what each of the three experiment modes runs.  Read by setup/setup.sh (which downloads
# and builds only what the mode needs) and by run/run_experiments.py (which plans the runs from it).
# Format: key = space-separated values.
#
#   <mode>.benchmarks             the problem directories under benchmarks/, in run order
#   <mode>.columns.<benchmark>    the solver columns of the paper's tables (benchmarks/<b>/README.txt names them)
#   <mode>.families.<benchmark>   the instance families of the paper's tables
#   <mode>.problems.<family>      matroid_intersections only: the problems of that family's table
#   <mode>.sizes                  first = the smallest size of every family; all = every size of the table
#   <mode>.instances              first = the first instance (and query) of every size; all = every one
#   <mode>.repeats                runs per problem and solver, each in its own process
#   <mode>.order                  by_benchmark, or round_robin: size by size across the benchmarks
#   <mode>.budget_hours           round_robin only: no run is started after this many hours since setup began
#   <mode>.exports                the code exports measured: pregenerated (shipped in exports/pregenerated),
#                                 or built (generated by the Isabelle build of setup); --old-generated-code
#                                 replaces either with campaign (exports/campaign, the paper's code)
#   <mode>.isabelle_sessions      the sessions the Isabelle build must produce for exports = built
#   <mode>.isabelle_dirs          the library directories whose ROOT files the build reads (the sessions above and
#                                 everything they depend on; setup/afp_entries.txt lists the AFP entries)
#   <mode>.roads                  the USA-road-t networks to download: none, NY, or all

